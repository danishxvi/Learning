spring.application.name=config-client
server.port=8090

# Fetches its own config from the Config Server at startup, keyed by spring.application.name
# (and any active profile) - see the .md for exactly how "config-client",
# "config-client-dev", and the shared "application" defaults are resolved and layered.
spring.config.import=configserver:http://localhost:8888

management.endpoints.web.exposure.include=refresh,health,info
