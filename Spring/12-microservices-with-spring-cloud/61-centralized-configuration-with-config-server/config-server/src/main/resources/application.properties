spring.application.name=config-server
server.port=8888

# The "native" profile backs the config server with a plain local directory instead of
# a git repository - simpler for this lesson, and (unlike a bundled classpath location)
# a real directory on disk that can be edited WHILE the server is running, which is
# exactly what the refresh demo in the .md relies on.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:./config-repo
