spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Auto-creates a route for every service registered with Eureka, at /<lowercased-service-id>/**
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# A hand-written route: rewrites /api/stock/{id} to /inventory/{id} before forwarding -
# demonstrates a real path rewrite filter, not just discovery-based pass-through.
spring.cloud.gateway.routes[0].id=stock-route
spring.cloud.gateway.routes[0].uri=lb://inventory-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/stock/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/stock/(?<id>.*), /inventory/${id}
