spring:
  application:
    name: entity-mapping-demo
  datasource:
    url: jdbc:h2:mem:entitymapping;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
